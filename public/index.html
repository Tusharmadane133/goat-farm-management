<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1B5E20" />
    <meta name="description" content="GoatFarm Pro - Farm Management System" />
    <title>GoatFarm Pro</title>

    <!-- Google Translate CSS fix: hide top bar -->
    <style>
      body { top: 0 !important; }
      .goog-te-banner-frame.skiptranslate { display: none !important; }
      .goog-te-gadget { display: none !important; }
      .skiptranslate { display: none !important; }
      /* Prevent page jump when translate bar appears */
      iframe.goog-te-banner-frame { display: none !important; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- Hidden Google Translate trigger element -->
    <div id="google_translate_element" style="display:none;"></div>

    <!-- Google Translate Script -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: 'en',
            includedLanguages: 'en,hi,mr',
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
            autoDisplay: false,
          },
          'google_translate_element'
        );
      }
    </script>
    <script
      type="text/javascript"
      src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
    ></script>
  </body>
</html>
